<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post com foto</title>
<style>
/*TOKENS*/
@font-face { font-family: "Roboto"; font-weight: 400; src: url("fonts/roboto-400.woff2") format("woff2"); }
@font-face { font-family: "Roboto"; font-weight: 700; src: url("fonts/roboto-700.woff2") format("woff2"); }
@font-face { font-family: "Roboto"; font-weight: 900; src: url("fonts/roboto-900.woff2") format("woff2"); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--white); }

[data-od-card] {
  position: relative;
  display: flex;
  flex-direction: column;
  width: var(--w);
  height: var(--h);
  overflow: hidden;
  background: var(--white);
  color: var(--gray);
  font-family: "Roboto", sans-serif;
}
[data-format="feed"] {
  --w: 1080px; --h: 1350px;
  --photo-h: 900px;
  --pad-x: 72px; --pad-top: 60px; --pad-bottom: 56px;
  --h1: 64px; --body: 28px; --cta: 30px; --emb: 177px;
}
[data-format="story"] {
  --w: 1080px; --h: 1920px;
  --photo-h: 1040px;
  --pad-x: 108px; --pad-top: 64px; --pad-bottom: 288px;
  --h1: 76px; --body: 34px; --cta: 36px; --emb: 240px;
}

.foto { flex: none; height: var(--photo-h); width: 100%; overflow: hidden; }
.foto img { display: block; width: 100%; height: 100%; object-fit: cover; }

.painel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
}
.barra { width: 120px; height: 12px; background: var(--yellow); }

[data-od-field="titulo"] {
  margin-top: 28px;
  font-weight: 900;
  font-size: var(--h1);
  line-height: 1.08;
  letter-spacing: -0.01em;
  text-wrap: balance;
  color: var(--gray);
}
[data-od-field="corpo"] {
  margin-top: 20px;
  font-weight: 400;
  font-size: var(--body);
  line-height: 1.4;
  color: var(--gray);
}
.rodape {
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
[data-od-field="cta"] {
  font-weight: 700;
  font-size: var(--cta);
  line-height: 1.2;
  letter-spacing: 0.02em;
  color: var(--gray);
  padding-bottom: 6px;
  border-bottom: 6px solid var(--yellow);
}
/* o PNG oficial vai inteiro (sem recorte nem recolor); a caixa recorta so a margem transparente,
   de modo que a caixa medida = o desenho visivel (0,699 x 0,650 da imagem) */
.emblema-box { flex: none; width: calc(var(--emb) * 0.699); height: calc(var(--emb) * 0.650); overflow: hidden; }
.emblema { display: block; width: var(--emb); height: auto; margin-left: calc(var(--emb) * -0.1506); margin-top: calc(var(--emb) * -0.1752); }
</style>
</head>
<body>
<div data-od-card data-variant="leo" data-format="{{formato}}">
  <div class="foto"><img src="{{foto}}" alt="{{alt}}"></div>
  <div class="painel">
    <div class="barra"></div>
    <h1 data-od-field="titulo">{{titulo}}</h1>
    <p data-od-field="corpo">{{corpo}}</p>
    <div class="rodape">
      <span data-od-field="cta">{{cta}}</span>
      <span class="emblema-box" data-od-logo><img class="emblema" src="logos/Emblemas_de_Leos/109141433__Logo_rgb_Leo_2C.png" width="{{emb_w}}" alt="Leo"></span>
    </div>
  </div>
</div>
</body>
</html>
