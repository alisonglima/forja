<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>Capa de campanha</title>
<style>
/*TOKENS*/

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ov1); }
[data-od-card] {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: var(--ov1); color: var(--white); font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
}
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* receita oficial (guia Leo-Lion 1.7): foto sob overlay de cor da marca; o texto branco fica sobre o overlay */
.base { position: absolute; inset: 0; background: var(--base); opacity: var(--base-a); }
.overlay { position: absolute; inset: 0; opacity: var(--ov-a); background: var(--ov1); }
/* faixa diagonal chapada na cor 2 (o kit oficial usa degrade; o brand_lint proibe gradiente, entao e forma plana) */
.faixa { position: absolute; inset: 0; background: var(--ov2); opacity: 0.26; clip-path: polygon(46% 0, 100% 0, 100% 100%, 12% 100%); }
/* cunha dourada no canto (kit oficial Leo-Lion, imagens de referencia do dono) */
.canto { position: absolute; right: 0; bottom: 0; width: 300px; height: 560px; background: var(--yellow); opacity: 0.55;
  clip-path: polygon(100% 0, 100% 100%, 0 100%); }

.topo { position: absolute; left: 72px; right: 72px; top: 72px; display: flex; justify-content: space-between; align-items: flex-start; }
.emblema-box { flex: none; overflow: hidden; }
.emblema { display: block; max-width: none; }
[data-od-field="arraste"] { padding-top: 10px; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }

.bloco { position: absolute; left: 72px; right: 72px; bottom: 176px; }
[data-od-field="eyebrow"] { font-size: 28px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 20px; }
[data-od-field="titulo"] { font-size: 120px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; max-width: 936px; width: fit-content; }
.fio { width: 360px; height: 6px; background: var(--yellow); margin: 32px 0 28px; }
[data-od-field="subtitulo"] { font-size: 36px; font-weight: 400; line-height: 1.3; max-width: 760px; width: fit-content; }

.rodape { position: absolute; left: 72px; bottom: 72px; display: flex; gap: 16px; font-size: 26px; line-height: 1.2; }
[data-od-field="clube"] { font-weight: 700; letter-spacing: 0.04em; }
[data-od-field="periodo"] { font-weight: 400; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div data-od-card data-variant="{{marca}}" data-format="{{formato}}">
  <img class="foto" src="{{foto}}" alt="{{alt}}">
  <div class="base"></div>
  <div class="overlay"></div>
  <div class="faixa"></div>
  <div class="canto"></div>
  <div class="topo">
    <span class="emblema-box" data-od-logo style="width:{{logo_box_w}}px;height:{{logo_box_h}}px"><img class="emblema" src="{{logo_src}}" width="{{logo_img_w}}" style="margin-left:{{logo_ml}}px;margin-top:{{logo_mt}}px" alt="{{marca}}"></span>
    <!--opt:arraste--><span data-od-field="arraste">{{arraste}} &rsaquo;</span><!--/opt:arraste-->
  </div>
  <div class="bloco">
    <!--opt:eyebrow--><p data-od-field="eyebrow">{{eyebrow}}</p><!--/opt:eyebrow-->
    <h1 data-od-field="titulo">{{titulo}}</h1>
    <div class="fio"></div>
    <!--opt:subtitulo--><p data-od-field="subtitulo">{{subtitulo}}</p><!--/opt:subtitulo-->
  </div>
  <div class="rodape">
    <span data-od-field="clube">{{clube}}</span><!--opt:periodo--><span data-od-field="periodo">{{periodo}}</span><!--/opt:periodo-->
  </div>
</div>
</body>
</html>
