<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>Editorial numero (dado em destaque)</title>
<style>
/*TOKENS*/

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ov1); }
[data-od-card] { position: relative; width: 1080px; height: var(--h); overflow: hidden; background: var(--ov1); color: var(--white); font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.base { position: absolute; inset: 0; background: var(--base); opacity: var(--base-a); }
.overlay { position: absolute; inset: 0; background: var(--ov1); opacity: var(--ov-a); }
.topo { position: absolute; left: var(--mx); right: var(--mx); top: var(--mt); display: flex; justify-content: flex-end; }
.emblema-box { flex: none; overflow: hidden; }
.emblema { display: block; max-width: none; }
.col { position: absolute; left: var(--mx); right: var(--mx); top: calc(var(--mt) + 258px); bottom: calc(var(--mb) + 78px); display: flex; flex-direction: column; justify-content: center; }
/* caixa de chamada: branca com texto na cor da marca (como o rotulo da data) */
[data-od-field="chamada"] { align-self: flex-start; background: var(--white); color: var(--lab); font-size: 46px; font-weight: 700; line-height: 1.15; padding: 14px 28px 18px; max-width: 880px; }
[data-od-field="numero"] { font-size: {{numero_px}}px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; color: var(--yellow); margin: 36px 0 8px; white-space: nowrap; }
[data-od-field="legenda"] { font-size: 40px; font-weight: 400; line-height: 1.3; max-width: 860px; }
.rodape { position: absolute; left: var(--mx); right: var(--mx); bottom: var(--mb); display: flex; gap: 16px; font-size: 26px; }
[data-od-field="clube"] { font-weight: 700; letter-spacing: 0.04em; }
[data-od-field="periodo"] { font-weight: 400; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div data-od-card data-variant="{{marca}}" data-format="{{formato}}">
  <img class="foto" src="{{foto}}" alt="{{alt}}">
  <div class="base"></div>
  <div class="overlay"></div>
  <div class="topo"><span class="emblema-box" data-od-logo style="width:{{logo_box_w}}px;height:{{logo_box_h}}px"><img class="emblema" src="{{logo_src}}" width="{{logo_img_w}}" style="margin-left:{{logo_ml}}px;margin-top:{{logo_mt}}px" alt="{{marca}}"></span></div>
  <div class="col">
    <p data-od-field="chamada">{{chamada}}</p>
    <p data-od-field="numero">{{numero}}</p>
    <p data-od-field="legenda">{{legenda}}</p>
  </div>
  <div class="rodape">
    <span data-od-field="clube">{{clube}}</span><!--opt:periodo--><span data-od-field="periodo">{{periodo}}</span><!--/opt:periodo-->
  </div>
</div>
</body>
</html>
