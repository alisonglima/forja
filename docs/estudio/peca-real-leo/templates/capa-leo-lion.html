<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>Capa de campanha Leo-Lion (estetica oficial)</title>
<style>
/*TOKENS*/
@font-face { font-family: "Roboto"; font-weight: 400; src: url("fonts/roboto-400.woff2") format("woff2"); }
@font-face { font-family: "Roboto"; font-weight: 700; src: url("fonts/roboto-700.woff2") format("woff2"); }
@font-face { font-family: "Roboto"; font-weight: 900; src: url("fonts/roboto-900.woff2") format("woff2"); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ov1); }
[data-od-card] {
  position: relative; width: 1080px; height: var(--h); overflow: hidden;
  background: var(--ov1); color: var(--white); font-family: "Roboto", sans-serif;
  --fita-h: 252px; --fita-b: calc(var(--mb) - 72px);
}
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* guia Leo-Lion (V1.0, p.10): foto sob overlay azul chapado + fita azul (blue ribbon) que ancora a composicao; chevrons amarelos como acento */
.overlay { position: absolute; inset: 0; background: var(--ov1); opacity: var(--ov-a); }
.fita { position: absolute; left: 0; right: 0; bottom: var(--fita-b); height: var(--fita-h); background: var(--sky);
  display: flex; align-items: center; justify-content: space-between; padding: 28px var(--mx) 72px; }  /* 72px = zona segura inferior minima do feed */
.fita-txt { display: flex; flex-direction: column; gap: 6px; font-size: 30px; line-height: 1.2; }
[data-od-field="clube"] { font-weight: 700; letter-spacing: 0.04em; }
[data-od-field="periodo"] { font-weight: 400; letter-spacing: 0.04em; }
.emblema-box { flex: none; overflow: hidden; }
.emblema { display: block; max-width: none; }

.topo { position: absolute; left: var(--mx); right: var(--mx); top: var(--mt); display: flex; justify-content: flex-end; }
[data-od-field="arraste"] { font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }

.bloco { position: absolute; left: var(--mx); right: var(--mx); bottom: calc(var(--fita-b) + var(--fita-h) + 64px); }
[data-od-field="eyebrow"] { font-size: 28px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 20px; }
[data-od-field="titulo"] { font-size: 120px; font-weight: 900; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; max-width: 880px; width: fit-content; }
.chevs { display: flex; gap: 10px; margin: 34px 0 30px; }
.chev { width: 34px; height: 52px; background: var(--yellow); clip-path: polygon(0 0, 45% 0, 100% 50%, 45% 100%, 0 100%, 55% 50%); }
[data-od-field="subtitulo"] { font-size: 36px; font-weight: 400; line-height: 1.3; max-width: 820px; width: fit-content; }
</style>
</head>
<body>
<div data-od-card data-variant="{{marca}}" data-format="{{formato}}">
  <img class="foto" src="{{foto}}" alt="{{alt}}">
  <div class="overlay"></div>
  <div class="topo">
    <!--opt:arraste--><span data-od-field="arraste">{{arraste}} &rsaquo;</span><!--/opt:arraste-->
  </div>
  <div class="bloco">
    <!--opt:eyebrow--><p data-od-field="eyebrow">{{eyebrow}}</p><!--/opt:eyebrow-->
    <h1 data-od-field="titulo">{{titulo}}</h1>
    <div class="chevs"><span class="chev"></span><span class="chev"></span><span class="chev"></span></div>
    <!--opt:subtitulo--><p data-od-field="subtitulo">{{subtitulo}}</p><!--/opt:subtitulo-->
  </div>
  <div class="fita">
    <div class="fita-txt">
      <span data-od-field="clube">{{clube}}</span><!--opt:periodo--><span data-od-field="periodo">{{periodo}}</span><!--/opt:periodo-->
    </div>
    <span class="emblema-box" data-od-logo style="width:{{logo_box_w}}px;height:{{logo_box_h}}px"><img class="emblema" src="{{logo_src}}" width="{{logo_img_w}}" style="margin-left:{{logo_ml}}px;margin-top:{{logo_mt}}px" alt="LEO"></span>
  </div>
</div>
</body>
</html>
