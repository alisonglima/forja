<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>Capa de campanha Leo-Lion (paridade com o grafico oficial, emblema LEO)</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ov1); }
[data-od-card] {
  position: relative; width: 1080px; height: var(--h); overflow: hidden;
  background: var(--ov1); color: var(--white); font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
}
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* overlay medido no vertical oficial (sombras da foto por altura): (13,52,113) no topo, (42,83,138) na base; com opacidade 0,74 (media medida, 0,79 no topo e ~0,6 na base) isso e o degrade azul -> azul claro da paleta, de cima para baixo */
.overlay { position: absolute; inset: 0; opacity: var(--ov-a); background: linear-gradient(180deg, var(--ov1) -36%, var(--ov2) 128%); }
/* pilha de faixas translucidas paralelas a 60 graus + cunha dourada, medidas no grafico vertical oficial 1080x1920 (157443765) (bordas a 434/356/274/162 px da borda direita no rodape da vertical 1080x1920, a 60 graus; opacidade medida por regressao nos dois lados de cada borda: faixas brancas 0,077 e cunha amarela 0,29) */
.faixa { position: absolute; inset: 0; background: var(--white); opacity: 0.077; }
.faixa.f1 { clip-path: polygon(calc(100% - 434px) 100%, 100% 100%, 100% calc(100% - 752px)); }
.faixa.f2 { clip-path: polygon(calc(100% - 356px) 100%, 100% 100%, 100% calc(100% - 617px)); }
.faixa.f3 { clip-path: polygon(calc(100% - 274px) 100%, 100% 100%, 100% calc(100% - 475px)); }
.canto { position: absolute; inset: 0; background: var(--yellow); opacity: 0.29; clip-path: polygon(calc(100% - 162px) 100%, 100% 100%, 100% calc(100% - 281px)); }
.emblema-box { flex: none; overflow: hidden; }
.emblema { display: block; max-width: none; }
.rotulo-clube { font-size: 21px; font-weight: 700; letter-spacing: 0.04em; line-height: 25px; }
/* metricas do grafico oficial vertical 1080x1920 (157443765), medidas por pixel: lockup no topo do bloco; titulo Arial Bold 107px com entrelinha 112px (as duas linhas sao coladas); regua amarela 520x10 de pontas redondas a 49px da linha de base; subtitulo 45px/55px; bloco ancorado a 110px da borda inferior; tudo a 110px da esquerda */
.topo { position: absolute; left: 110px; right: 110px; top: var(--mt); display: flex; justify-content: flex-end; }
[data-od-field="arraste"] { font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }
.bloco { position: absolute; left: 110px; right: 110px; bottom: 110px; }
.bloco .emblema-box { margin-bottom: 9px; }
[data-od-field="titulo"] { margin-top: 26px; font-size: 107px; font-weight: 700; line-height: 112px; max-width: 860px; }
.regua { width: 520px; height: 10px; border-radius: 5px; background: var(--yellow); margin-top: 29px; }
[data-od-field="subtitulo"] { margin-top: 36px; font-size: 45px; font-weight: 400; line-height: 55px; max-width: 600px; white-space: pre-line; }
</style>
</head>
<body>
<div data-od-card data-variant="{{marca}}" data-format="{{formato}}">
  <img class="foto" src="{{foto}}" alt="{{alt}}">
  <div class="overlay" data-od-allow="slop-glow"></div><!-- degrade azul -> azul claro da paleta Leo-Lion; excecao declarada ao check slop-glow do Open Design -->
  <div class="faixa f1"></div>
  <div class="faixa f2"></div>
  <div class="faixa f3"></div>
  <div class="canto"></div>
  <div class="topo">
    <!--opt:arraste--><span data-od-field="arraste">{{arraste}} &rsaquo;</span><!--/opt:arraste-->
  </div>
  <div class="bloco">
    <span class="emblema-box" data-od-logo style="width:{{logo_box_w}}px;height:{{logo_box_h}}px"><img class="emblema" src="{{logo_src}}" width="{{logo_img_w}}" style="margin-left:{{logo_ml}}px;margin-top:{{logo_mt}}px" alt="LEO"></span>
    <p class="rotulo-clube"><span data-od-field="clube">{{clube}}</span><!--opt:periodo--> <span data-od-field="periodo">&middot; {{periodo}}</span><!--/opt:periodo--></p>
    <h1 data-od-field="titulo">{{titulo}}</h1>
    <div class="regua"></div>
    <!--opt:subtitulo--><p data-od-field="subtitulo">{{subtitulo}}</p><!--/opt:subtitulo-->
  </div>
</div>
</body>
</html>
