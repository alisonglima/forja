<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>Data comemorativa Leo-Lion (paridade com o grafico oficial, emblema LEO)</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ov1); }
[data-od-card] {
  position: relative; width: 1080px; height: var(--h); overflow: hidden;
  background: var(--ov1); color: var(--white); font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
}
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* overlay medido nos graficos oficiais Leo-Lion (regressao nos pixels mais claros/escuros da foto): azul ~(20,65,165) a 0,64 (vertical), 0,73 (horizontal), 0,48 (quadrado); aqui degrade azul -> azul claro da paleta */
.overlay { position: absolute; inset: 0; opacity: var(--ov-a); background: linear-gradient(0deg, var(--ov1) 0%, var(--ov2) 200%); }
/* pilha de faixas translucidas paralelas a 60 graus + cunha dourada, medidas no grafico horizontal 1920x1080 (bordas a 464/386/304/192 px da borda direita no rodape; tan 60 = 1,732); mesmos px nos outros formatos */
.faixa { position: absolute; inset: 0; background: var(--white); opacity: 0.05; }
.faixa.f1 { clip-path: polygon(calc(100% - 464px) 100%, 100% 100%, 100% calc(100% - 804px)); }
.faixa.f2 { clip-path: polygon(calc(100% - 386px) 100%, 100% 100%, 100% calc(100% - 669px)); }
.faixa.f3 { clip-path: polygon(calc(100% - 304px) 100%, 100% 100%, 100% calc(100% - 527px)); }
.canto { position: absolute; inset: 0; background: var(--yellow); opacity: 0.35; clip-path: polygon(calc(100% - 192px) 100%, 100% 100%, 100% calc(100% - 332px)); }
.emblema-box { flex: none; overflow: hidden; }
.emblema { display: block; max-width: none; }
.rotulo-clube { font-size: 21px; font-weight: 700; letter-spacing: 0.04em; line-height: 25px; }
/* metricas do grafico oficial quadrado 1080x1080 (157443769), medidas por pixel: caixa branca 796 de largura; titulo Arial Bold 64px (azul) e linha cinza regular 55px; tres chevrons amarelos 266x112 presos ao canto inferior direito, 25px da borda direita e 39px abaixo da caixa */
.topo { position: absolute; left: var(--mx); top: var(--mt); display: flex; flex-direction: column; }
.topo .emblema-box { margin-bottom: 9px; }
.caixa { position: absolute; left: var(--mx); width: 796px; bottom: calc(var(--mb) + 39px); background: var(--white); padding: 52px 34px 50px; }
h1 { color: var(--lab); font-size: 64px; font-weight: 700; line-height: 70px; margin-bottom: 16px; }
[data-od-field="rotulo"], [data-od-field="titulo"] { font-weight: 700; }
[data-od-field="data"] { color: var(--gray); font-size: 55px; font-weight: 400; line-height: 60px; }
.chevs { position: absolute; right: 25px; bottom: -39px; display: flex; }
.chev { width: 102px; height: 112px; margin-left: -17px; background: var(--yellow); clip-path: polygon(0 0, 52% 0, 100% 50%, 52% 100%, 0 100%, 48% 50%); }
.chev:first-child { margin-left: 0; }
</style>
</head>
<body>
<div data-od-card data-variant="{{marca}}" data-format="{{formato}}">
  <img class="foto" src="{{foto}}" alt="{{alt}}">
  <div class="overlay" data-od-allow="slop-glow"></div><!-- degrade azul -> azul claro da paleta Leo-Lion; excecao declarada ao check slop-glow do Open Design -->
  <div class="faixa f1"></div>
  <div class="faixa f2"></div>
  <div class="faixa f3"></div>
  <div class="canto"></div>
  <div class="topo">
    <span class="emblema-box" data-od-logo style="width:{{logo_box_w}}px;height:{{logo_box_h}}px"><img class="emblema" src="{{logo_src}}" width="{{logo_img_w}}" style="margin-left:{{logo_ml}}px;margin-top:{{logo_mt}}px" alt="LEO"></span>
    <p class="rotulo-clube"><span data-od-field="clube">{{clube}}</span><!--opt:periodo--> <span data-od-field="periodo">&middot; {{periodo}}</span><!--/opt:periodo--></p>
  </div>
  <div class="caixa">
    <h1><span data-od-field="rotulo">{{rotulo}}</span> <span data-od-field="titulo">{{titulo}}</span></h1>
    <p data-od-field="data">{{data}}</p>
    <div class="chevs"><span class="chev"></span><span class="chev"></span><span class="chev"></span></div>
  </div>
</div>
</body>
</html>
