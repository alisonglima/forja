<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>Capa vertical (modelo default, paridade artistica com o grafico oficial 157443765)</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ov1); }
[data-od-card] {
  position: relative; width: 1080px; height: var(--h); overflow: hidden;
  background: var(--ov1); color: var(--white); font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
}
.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* overlay medido no vertical oficial (claros e sombras da foto por altura): opacidade 0,79 no topo caindo linear a ~0,59 na base; cor azul + 22% azul claro no topo ate azul + 83% azul claro na base. SVG porque o lint de marca nao aceita CSS gradient com transparencia */
.overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* tres faixas brancas chapadas a 60 graus, 0,077 de opacidade (regressao nos dois lados de cada borda); bordas a 434/356/274 px da borda direita no rodape */
.faixa { position: absolute; inset: 0; background: var(--white); opacity: 0.077; }
.faixa.f1 { clip-path: polygon(calc(100% - 434px) 100%, 100% 100%, 100% calc(100% - 752px)); }
.faixa.f2 { clip-path: polygon(calc(100% - 356px) 100%, 100% 100%, 100% calc(100% - 617px)); }
.faixa.f3 { clip-path: polygon(calc(100% - 274px) 100%, 100% 100%, 100% calc(100% - 475px)); }
/* cunha amarela em degrade: 0,30 na borda diagonal caindo linear a 0 em 105 px (perfil de profundidade medido no oficial) */
.canto { position: absolute; right: 0; bottom: 0; width: 162px; height: 281px; display: block; }
.emblema-box { flex: none; overflow: hidden; }
.emblema { display: block; max-width: none; }
/* metricas medidas no oficial 1080x1920: emblema 1C branco 183 px de altura, topo em y1187, borda esquerda em x117; titulo Arial Bold 107px, entrelinha 112px (ink 1417-1514 e 1549-1606); regua 520x10 de pontas redondas; subtitulo 45px/55px; bloco a 110px da base; margem esquerda 110px */
.bloco { position: absolute; left: 110px; right: 110px; bottom: 110px; }
.bloco .emblema-box { display: block; margin-left: 7px; }
[data-od-field="titulo"] { margin-top: 32px; font-size: 107px; font-weight: 700; line-height: 112px; max-width: 860px; }
.regua { width: 520px; height: 10px; border-radius: 5px; background: var(--yellow); margin-top: 29px; }
[data-od-field="subtitulo"] { margin-top: 36px; font-size: 45px; font-weight: 400; line-height: 55px; max-width: 600px; white-space: pre-line; }
</style>
</head>
<body>
<div data-od-card data-variant="{{marca}}" data-format="{{formato}}">
  <img class="foto" src="{{foto}}" alt="{{alt}}">
  <svg class="overlay" data-od-allow="slop-glow" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ov" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: color-mix(in srgb, var(--ov1) 78%, var(--ov2)); stop-opacity: 0.79"/><stop offset="1" style="stop-color: color-mix(in srgb, var(--ov1) 17%, var(--ov2)); stop-opacity: 0.59"/></linearGradient></defs><rect width="1" height="1" fill="url(#ov)"/></svg>
  <div class="faixa f1"></div>
  <div class="faixa f2"></div>
  <div class="faixa f3"></div>
  <svg class="canto" viewBox="0 0 162 281" aria-hidden="true"><defs><linearGradient id="cunha" gradientUnits="userSpaceOnUse" x1="0" y1="281" x2="90.9" y2="333.5"><stop offset="0" style="stop-color: var(--yellow); stop-opacity: 0.30"/><stop offset="1" style="stop-color: var(--yellow); stop-opacity: 0"/></linearGradient></defs><polygon points="0,281 162,281 162,0" fill="url(#cunha)"/></svg>
  <div class="bloco">
    <span class="emblema-box" data-od-logo style="width:{{logo_box_w}}px;height:{{logo_box_h}}px"><img class="emblema" src="{{logo_src}}" width="{{logo_img_w}}" style="margin-left:{{logo_ml}}px;margin-top:{{logo_mt}}px" alt="Emblema LEO"></span>
    <h1 data-od-field="titulo">{{titulo}}</h1>
    <div class="regua"></div>
    <p data-od-field="subtitulo">{{subtitulo}}</p>
  </div>
</div>
</body>
</html>
