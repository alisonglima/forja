name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Testes
        run: python -m pytest -q tests
      - name: Doc determinística
        if: matrix.python == '3.12'
        run: |
          python -I scripts/build-doc.py --out /tmp/guia-a.html
          python -I scripts/build-doc.py --out /tmp/guia-b.html
          cmp /tmp/guia-a.html /tmp/guia-b.html
