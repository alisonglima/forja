name: Ideia
description: Proposta de melhoria ou novo provedor/workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Descreva o uso real, não só a solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução? Encaixa em provedor, workflow ou CLI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: Li o guia e o DESIGN.md
        - label: Procurei issues existentes
